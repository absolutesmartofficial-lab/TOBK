<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Ujian - TOBK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gradient-to-tr from-slate-50 to-slate-100 min-h-screen flex items-center justify-center p-4 font-sans antialiased text-slate-800">

    <div class="bg-white w-full max-w-2xl rounded-2xl shadow-xl border border-slate-100 p-6 md:p-10 my-6">
        
        <div class="text-center border-b border-slate-100 pb-6 mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-100 text-emerald-600 mb-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Hasil Evaluasi Ujian</h1>
            <p class="text-sm text-slate-500 mt-1">Terima kasih telah menyelesaikan ujian TOBK Utama Fisika & Matematika.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 md:col-span-2 flex flex-col justify-center">
                <p class="text-xs text-slate-400 font-medium uppercase tracking-wider">Nama Peserta</p>
                <p id="resNama" class="text-lg font-bold text-slate-700 mt-0.5">-</p>
                <div class="mt-3 pt-3 border-t border-slate-200/60 grid grid-cols-2 gap-2 text-xs text-slate-500">
                    <div>Status: <span class="text-emerald-600 font-semibold">Selesai</span></div>
                    <div>Waktu: <span class="font-semibold">03 Juni 2026</span></div>
                </div>
            </div>
            <div class="bg-blue-600 text-white p-6 rounded-xl shadow-lg shadow-blue-100 text-center flex flex-col justify-center items-center">
                <p class="text-xs font-semibold text-blue-200 uppercase tracking-wider">Total Skor</p>
                <p id="resSkor" class="text-4xl font-extrabold mt-1">0</p>
                <p class="text-[10px] text-blue-200 mt-2">Skala Maksimal: 100</p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center bg-slate-50/50 rounded-2xl p-6 border border-slate-100">
            
            <div class="w-full max-w-[220px] mx-auto aspect-square flex items-center justify-center">
                <canvas id="pieChartHasil"></canvas>
            </div>

            <div class="space-y-3.5">
                <h3 class="text-sm font-bold text-slate-700 tracking-tight mb-2">Rincian Jawaban:</h3>
                
                <div class="flex items-center justify-between p-3 bg-white rounded-xl border border-slate-100 shadow-sm">
                    <div class="flex items-center gap-3">
                        <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
                        <span class="text-sm font-medium text-slate-600">Jawaban Benar</span>
                    </div>
                    <span id="statBenar" class="text-sm font-bold text-emerald-600">0 Soal</span>
                </div>

                <div class="flex items-center justify-between p-3 bg-white rounded-xl border border-slate-100 shadow-sm">
                    <div class="flex items-center gap-3">
                        <span class="w-3 h-3 rounded-full bg-rose-500"></span>
                        <span class="text-sm font-medium text-slate-600">Jawaban Salah</span>
                    </div>
                    <span id="statSalah" class="text-sm font-bold text-rose-600">0 Soal</span>
                </div>

                <div class="flex items-center justify-between p-3 bg-white rounded-xl border border-slate-100 shadow-sm">
                    <div class="flex items-center gap-3">
                        <span class="w-3 h-3 rounded-full bg-slate-300"></span>
                        <span class="text-sm font-medium text-slate-600">Tidak Dijawab</span>
                    </div>
                    <span id="statKosong" class="text-sm font-bold text-slate-500">0 Soal</span>
                </div>
            </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-3 justify-end mt-8 pt-4 border-t border-slate-100">
            <button onclick="keluarSesi()" class="w-full sm:w-auto bg-slate-800 hover:bg-slate-900 text-white font-medium py-2.5 px-6 rounded-xl text-sm transition shadow-md shadow-slate-100 text-center">
                Keluar & Kembali ke Login
            </button>
        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 1. Ambil data nama dan data jawaban dari localStorage
            const namaSiswa = localStorage.getItem('namaSiswa') || "Peserta TOBK";
            const rawJawaban = localStorage.getItem('jawabanSiswa');
            
            document.getElementById('resNama').innerText = namaSiswa;

            if (!rawJawaban) {
                alert("Data ujian tidak ditemukan. Anda dialihkan ke halaman utama.");
                window.location.href = "index.html";
                return;
            }

            const jawabanSiswa = JSON.parse(rawJawaban);
            
            // 2. Tentukan kunci jawaban berdasarkan jumlah soal secara otomatis
            let kunciJawabanUjian = [];
            
            if (jawabanSiswa.length === 5) {
                // Kunci Jawaban untuk BAB 1 (5 Soal): C, A, C, A, A
                kunciJawabanUjian = [2, 0, 2, 0, 0];
            } else if (jawabanSiswa.length === 10) {
                // Kunci Jawaban untuk BAB 2 & 3 (10 Soal): A, A, D, D, D, A, C, D, B, B
                kunciJawabanUjian = [0, 0, 3, 3, 3, 0, 2, 3, 1, 1];
            } else {
                kunciJawabanUjian = new Array(jawabanSiswa.length).fill(0); // Cadangan jika panjang berbeda
            }

            const bobotPerSoal = 100 / kunciJawabanUjian.length;

            // 3. Kalkulasi Benar, Salah, Kosong, dan Skor
            let jumlahBenar = 0;
            let jumlahSalah = 0;
            let jumlahKosong = 0;

            kunciJawabanUjian.forEach((kunci, idx) => {
                const jwbSiswa = jawabanSiswa[idx];
                if (jwbSiswa === null || jwbSiswa === undefined) {
                    jumlahKosong++;
                } else if (jwbSiswa === kunci) {
                    jumlahBenar++;
                } else {
                    jumlahSalah++;
                }
            });

            let skorAkhir = Math.round(jumlahBenar * bobotPerSoal);

            // 4. Tampilkan angka statistik ke elemen HTML
            document.getElementById('resSkor').innerText = skorAkhir;
            document.getElementById('statBenar').innerText = `${jumlahBenar} Soal`;
            document.getElementById('statSalah').innerText = `${jumlahSalah} Soal`;
            document.getElementById('statKosong').innerText = `${jumlahKosong} Soal`;

            // 5. Render Pie Chart menggunakan Chart.js
            const ctx = document.getElementById('pieChartHasil').getContext('2d');
            new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['Benar', 'Salah', 'Tidak Dijawab'],
                    datasets: [{
                        data: [jumlahBenar, jumlahSalah, jumlahKosong],
                        backgroundColor: [
                            '#10b981', // emerald-500 (Benar)
                            '#f43f5e', // rose-500 (Salah)
                            '#cbd5e1'  // slate-300 (Kosong)
                        ],
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        });

       function keluarSesi() {
    // 1. Bersihkan semua sesi ujian dan nama siswa yang tersimpan
    localStorage.clear(); 
    
    // 2. Alihkan otomatis ke file login (pastikan file index.html ada di folder yang sama)
    window.location.href = "Login.html"; 
}
    </script>
</body>
</html>
