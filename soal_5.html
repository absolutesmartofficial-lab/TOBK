<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Ujian - TOBK BAB 4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen font-sans antialiased text-slate-800">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 px-6 py-4 flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <span class="bg-blue-600 text-white font-bold px-3 py-1.5 rounded-lg text-sm tracking-wider">TOBK</span>
            <h2 class="font-semibold text-slate-700 border-l border-slate-200 pl-3">Ujian Utama: Fluida Statis & Dinamis (20 Soal)</h2>
        </div>
        
        <div class="flex items-center gap-6">
            <div class="text-right hidden sm:block">
                <p class="text-xs text-slate-400">Peserta Ujian</p>
                <p id="displayName" class="text-sm font-semibold text-slate-700">-</p>
            </div>
            <div class="bg-amber-50 border border-amber-200 rounded-xl px-4 py-2 flex items-center gap-2">
                <svg class="w-5 h-5 text-amber-600 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span id="countdown" class="font-mono font-bold text-amber-700 text-sm">02:00:00</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">
                <div class="flex justify-between items-center mb-6">
                    <span id="textNomorSoal" class="bg-blue-50 text-blue-700 px-3 py-1 rounded-md text-xs font-bold uppercase tracking-wider">SOAL NOMOR 1</span>
                    <span class="text-xs text-slate-400">Bobot: 5 Poin</span>
                </div>

                <div id="kontenSoal" class="text-base md:text-lg text-slate-800 leading-relaxed mb-8 font-medium"></div>
                <div id="kontenPilihan" class="space-y-3"></div>
            </div>

            <div class="flex justify-between items-center">
                <button id="btnPrev" onclick="pergiKeSoal(currentIdx - 1)" class="bg-white border border-slate-300 text-slate-600 px-5 py-2.5 rounded-xl text-sm font-medium hover:bg-slate-50 transition disabled:opacity-40 disabled:cursor-not-allowed">
                    Sebelumnya
                </button>
                <button id="btnRagu" onclick="tandaiRaguRagu()" class="bg-amber-500 hover:bg-amber-600 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition">
                    Ragu-Ragu
                </button>
                <button id="btnNext" onclick="pergiKeSoal(currentIdx + 1)" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl text-sm font-medium shadow-md transition">
                    Selanjutnya
                </button>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 h-fit">
            <h3 class="text-sm font-bold text-slate-700 mb-4 border-b border-slate-100 pb-3">Navigasi Soal</h3>
            
            <div id="gridNavigasi" class="grid grid-cols-5 gap-2"></div>

            <div class="mt-6 pt-4 border-t border-slate-100 grid grid-cols-2 gap-2 text-xs text-slate-500">
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-blue-600 inline-block"></span> Aktif</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-emerald-500 inline-block"></span> Terjawab</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-amber-500 inline-block"></span> Ragu-Ragu</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-white border border-slate-200 inline-block"></span> Belum Diisi</div>
            </div>

            <div class="mt-6 border-t border-slate-100 pt-4">
                <button onclick="finishExam()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-xl text-sm transition shadow-lg shadow-emerald-50">
                    Selesai Ujian & Kumpulkan
                </button>
            </div>
        </div>
    </main>

    <script>
        // Data bank soal Fluida Statis & Dinamis (15 Hitungan, 5 Konsep)
        const dataUjian = [
            { id: 1, tanya: "[Hitungan] Seorang penyelam berada pada kedalaman 15 meter di bawah permukaan air laut (massa jenis air laut = 1.020 kg/m³). Jika tekanan atmosfer adalah 10⁵ Pa dan g = 10 m/s², tekanan total yang dialami penyelam tersebut adalah...", opsi: ["A. 1,53 x 10⁵ Pa", "B. 2,02 x 10⁵ Pa", "C. 2,53 x 10⁵ Pa", "D. 3,06 x 10⁵ Pa", "E. 3,53 x 10⁵ Pa"] },
            { id: 2, tanya: "[Hitungan] Sebuah dongkrak hidrolik memiliki diameter piston kecil 4 cm dan piston besar 20 cm. Jika pada piston kecil diberikan gaya sebesar 200 N, massa beban maksimum yang dapat diangkat pada piston besar adalah... (g = 10 m/s²)", opsi: ["A. 200 kg", "B. 400 kg", "C. 500 kg", "D. 1.000 kg", "E. 5.000 kg"] },
            { id: 3, tanya: "[Hitungan] Sebuah balok kayu terapung di air dengan 40% volumenya muncul di atas permukaan air. Jika massa jenis air adalah 1 g/cm³, massa jenis balok kayu tersebut adalah...", opsi: ["A. 0,2 g/cm³", "B. 0,4 g/cm³", "C. 0,6 g/cm³", "D. 0,8 g/cm³", "E. 1,2 g/cm³"] },
            { id: 4, tanya: "[Hitungan] Sepotong emas (massa jenis = 19,3 g/cm³) memiliki berat 1,93 N di udara. Ketika ditimbang di dalam air (massa jenis = 1 g/cm³), berat emas tersebut seolah-olah menjadi... (g = 10 m/s²)", opsi: ["A. 1,83 N", "B. 1,73 N", "C. 1,63 N", "D. 1,53 N", "E. 1,43 N"] },
            { id: 5, tanya: "[Hitungan] Sebuah pipa kapiler dengan diameter 0,4 mm dimasukkan tegak lurus ke dalam bejana berisi air (tegangan permukaan = 0,073 N/m, sudut kontak = 0°). Kenaikan tinggi air di dalam pipa kapiler adalah... (g = 10 m/s², ρ = 1.000 kg/m³)", opsi: ["A. 1,46 cm", "B. 3,65 cm", "C. 7,30 cm", "D. 14,6 cm", "E. 29,2 cm"] },
            { id: 6, tanya: "[Hitungan] Sebuah bola kecil berdiameter 2 mm dijatuhkan ke dalam oli yang memiliki koefisien viskositas 0,11 Pa.s. Jika massa jenis bola 2.700 kg/m³ dan massa jenis oli 900 kg/m³, kecepatan terminal bola tersebut adalah... (g = 10 m/s²)", opsi: ["A. 0,18 m/s", "B. 0,36 m/s", "C. 0,72 m/s", "D. 1,44 m/s", "E. 1,80 m/s"] },
            { id: 7, tanya: "[Hitungan] Air mengalir melalui pipa yang luas penampangnya 10 cm² dengan kecepatan 4 m/s. Jika pipa tersebut menyempit hingga luas penampangnya menjadi 2 cm², kecepatan aliran air pada penampang kecil adalah...", opsi: ["A. 8 m/s", "B. 12 m/s", "C. 16 m/s", "D. 20 m/s", "E. 24 m/s"] },
            { id: 8, tanya: "[Hitungan] Sebuah tangki besar berisi air setinggi 2,5 meter memiliki kebocoran kecil pada dindingnya yang berjarak 1,25 meter dari dasar tangki. Kecepatan air yang keluar dari lubang bocor tersebut adalah... (g = 10 m/s²)", opsi: ["A. 2,5 m/s", "B. 5,0 m/s", "C. 7,5 m/s", "D. 10 m/s", "E. 12,5 m/s"] },
            { id: 9, tanya: "[Hitungan] Berdasarkan soal nomor 8, jarak horizontal maksimum (X) yang dicapai oleh pancaran air saat menyentuh lantai adalah...", opsi: ["A. 1,25 meter", "B. 2,50 meter", "C. 3,75 meter", "D. 5,00 meter", "E. 6,25 meter"] },
            { id: 10, tanya: "[Hitungan] Pipa venturimeter tanpa manometer memiliki luas penampang besar 5 cm² dan penampang kecil 3 cm². Jika perbedaan ketinggian air pada tabung pengukur adalah 20 cm, kecepatan air yang masuk pada penampang besar adalah... (g = 10 m/s²)", opsi: ["A. 1,5 m/s", "B. 2,0 m/s", "C. 2,5 m/s", "D. 3,0 m/s", "E. 3,5 m/s"] },
            { id: 11, tanya: "[Hitungan] Sebuah pipa pitot digunakan untuk mengukur kecepatan aliran udara (ρ = 1,2 kg/m³). Jika perbedaan tinggi raksa (ρ = 13.600 kg/m³) pada manometer adalah 4,5 cm, kecepatan aliran udara tersebut adalah... (g = 10 m/s²)", opsi: ["A. 15 m/s", "B. 30 m/s", "C. 45 m/s", "D. 60 m/s", "E. 75 m/s"] },
            { id: 12, tanya: "[Hitungan] Sebuah pesawat terbang memiliki luas total sayap 40 m². Jika kecepatan aliran udara di atas sayap 250 m/s dan di bawah sayap 200 m/s, besar gaya angkat pesawat tersebut adalah... (ρ udara = 1,2 kg/m³)", opsi: ["A. 120 kN", "B. 240 kN", "C. 360 kN", "D. 480 kN", "E. 540 kN"] },
            { id: 13, tanya: "[Hitungan] Air mengalir melalui pipa horizontal dengan kecepatan 2 m/s dan tekanan 2 x 10⁵ Pa. Pada ujung pipa yang menyempit, kecepatan air menjadi 6 m/s. Tekanan air pada penampang kecil tersebut adalah... (ρ air = 1.000 kg/m³)", opsi: ["A. 1,24 x 10⁵ Pa", "B. 1,64 x 10⁵ Pa", "C. 1,84 x 10⁵ Pa", "D. 2,16 x 10⁵ Pa", "E. 2,36 x 10⁵ Pa"] },
            { id: 14, tanya: "[Hitungan] Sebuah wadah berbentuk silinder diisi penuh air setinggi 1 meter. Sebuah lubang dibuat di dasar wadah sehingga air habis mengalir keluar dalam waktu 20 detik. Jika wadah diisi penuh air setinggi 4 meter, waktu yang dibutuhkan untuk mengosongkan wadah tersebut adalah...", opsi: ["A. 10 detik", "B. 20 detik", "C. 40 detik", "D. 60 detik", "E. 80 detik"] },
            { id: 15, tanya: "[Hitungan] Sebuah pipa horizontal mengalirkan air dengan debit 5 Liter/sekon. Jika jari-jari pipa tersebut adalah 5 cm, kecepatan rata-rata aliran air di dalam pipa adalah mendekati...", opsi: ["A. 0,32 m/s", "B. 0,64 m/s", "C. 1,28 m/s", "D. 2,56 m/s", "E. 5,00 m/s"] },
            { id: 16, tanya: "[Konsep] Pernyataan berikut ini yang tidak sesuai dengan karakteristik dari fluida ideal pada materi fluida dinamis adalah...", opsi: ["A. Aliran fluida bersifat tunak (steady)", "B. Aliran fluida bersifat kental (viscous)", "C. Fluida tidak termampatkan (incompressible)", "D. Aliran fluida bersifat garis arus (streamline)", "E. Aliran tidak berputar (irrotational)"] },
            { id: 17, tanya: "[Konsep] Mengapa selembar kertas yang diletakkan di bawah bibir akan bergerak naik saat kita meniup bagian atas permukaan kertas tersebut secara horizontal? Hal ini disebabkan karena...", opsi: ["A. Tekanan udara di atas kertas menjadi lebih kecil daripada tekanan di bawah kertas", "B. Tekanan udara di atas kertas menjadi lebih besar daripada tekanan di bawah kertas", "C. Gaya dorong tiupan angin mengenai permukaan bawah kertas", "D. Adanya gaya archimedes dari udara panas tiupan", "E. Efek tegangan permukaan pada kertas meningkat"] },
            { id: 18, tanya: "[Konsep] Kapal laut yang terbuat dari besi yang sangat berat dapat terapung di atas permukaan air laut. Konsep fisika yang paling tepat menjelaskan fenomena ini adalah...", opsi: ["A. Gaya angkat hidrostatik bergantung pada kedalaman posisi kapal", "B. Volume air laut yang dipindahkan menghasilkan gaya apung yang sama dengan berat total kapal", "C. Massa jenis besi kapal mengecil saat menyentuh garam air laut", "D. Tekanan hidrostatis di dasar kapal lebih kecil daripada tekanan atmosfer", "E. Tegangan permukaan air laut menahan beban besi kapal"] },
            { id: 19, tanya: "[Konsep] Gejala kapilaritas pada pipa kapiler yang dimasukkan ke dalam air menyebabkan permukaan air dalam pipa naik berbentuk meniskus cekung. Faktor utama penyebab hal tersebut adalah...", opsi: ["A. Gaya kohesi air lebih besar daripada gaya adhesi air dengan dinding kaca", "B. Gaya adhesi air dengan dinding kaca lebih besar daripada gaya kohesinya", "C. Massa jenis air lebih kecil dibandingkan massa jenis kaca pipa", "D. Tekanan udara di dalam pipa kapiler vakum", "E. Adanya viskositas fluida yang mendorong air naik"] },
            { id: 20, tanya: "[Konsep] Lintasan aliran fluida dinamis di mana partikel-partikel fluida yang berurutan mengikuti jalur yang sama tanpa saling berpotongan disebut dengan...", opsi: ["A. Aliran turbulen", "B. Aliran laminer / garis arus", "C. Aliran rotasional", "D. Aliran termampatkan", "E. Aliran viskos"] }
        ];

        let currentIdx = 0; 
        let jawabanSiswa = new Array(dataUjian.length).fill(null); 
        let statusRagu = new Array(dataUjian.length).fill(false);   

        document.addEventListener("DOMContentLoaded", function() {
            const namaSiswa = localStorage.getItem('namaSiswa');
            if (!namaSiswa) { window.location.href = "index.html"; return; }
            document.getElementById('displayName').innerText = namaSiswa;
            renderSoal(); renderNavigasiPanel(); initCountdown(7200);
        });

        function renderSoal() {
            const itemSoal = dataUjian[currentIdx];
            document.getElementById('textNomorSoal').innerText = `SOAL NOMOR ${itemSoal.id}`;
            document.getElementById('kontenSoal').innerHTML = itemSoal.tanya;

            const kontenerPilihan = document.getElementById('kontenPilihan');
            kontenerPilihan.innerHTML = ''; 

            // Menggunakan opsi A sampai E (index 0 - 4)
            itemSoal.opsi.forEach((opsiTeks, idx) => {
                const terpilih = jawabanSiswa[currentIdx] === idx;
                const stylingCard = terpilih ? 'border-blue-500 bg-blue-50/40 text-blue-900 font-semibold ring-1 ring-blue-500' : 'border-slate-200 text-slate-700 hover:bg-slate-50/80';
                kontenerPilihan.insertAdjacentHTML('beforeend', `<label onclick="simpanJawabanSiswa(${idx})" class="flex items-center gap-4 p-4 rounded-xl border ${stylingCard} cursor-pointer transition"><input type="radio" name="opsiUjian" ${terpilih ? 'checked' : ''} class="w-4 h-4 text-blue-600 font-medium"><span class="text-sm">${opsiTeks}</span></label>`);
            });

            document.getElementById('btnPrev').disabled = (currentIdx === 0);
            const btnNext = document.getElementById('btnNext');
            if (currentIdx === dataUjian.length - 1) {
                btnNext.innerText = "Selesai"; btnNext.className = "bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl text-sm font-medium shadow-md transition"; btnNext.onclick = finishExam;
            } else {
                btnNext.innerText = "Selanjutnya"; btnNext.className = "bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl text-sm font-medium shadow-md transition"; btnNext.onclick = () => pergiKeSoal(currentIdx + 1);
            }
        }

        function simpanJawabanSiswa(idxOpsi) { jawabanSiswa[currentIdx] = idxOpsi; statusRagu[currentIdx] = false; renderSoal(); renderNavigasiPanel(); }
        function tandaiRaguRagu() { if (jawabanSiswa[currentIdx] === null) { alert("Pilih opsi jawaban terlebih dahulu!"); return; } statusRagu[currentIdx] = !statusRagu[currentIdx]; renderSoal(); renderNavigasiPanel(); }
        function pergiKeSoal(targetIdx) { if (targetIdx >= 0 && targetIdx < dataUjian.length) { currentIdx = targetIdx; renderSoal(); renderNavigasiPanel(); } }

        function renderNavigasiPanel() {
            const panelGrid = document.getElementById('gridNavigasi'); panelGrid.innerHTML = ''; 
            dataUjian.forEach((soal, idx) => {
                let statusStyle = "bg-white border-slate-200 text-slate-700"; 
                if (jawabanSiswa[idx] !== null) statusStyle = "bg-emerald-500 text-white border-emerald-600"; 
                if (statusRagu[idx]) statusStyle = "bg-amber-500 text-white border-amber-600"; 
                if (idx === currentIdx) statusStyle = "bg-blue-600 text-white ring-4 ring-blue-100 border-blue-700 font-bold"; 
                panelGrid.insertAdjacentHTML('beforeend', `<button onclick="pergiKeSoal(${idx})" class="w-full aspect-square rounded-xl text-xs font-semibold border ${statusStyle}">${soal.id}</button>`);
            });
        }

        function initCountdown(totalDetik) {
            let sisaWaktu = totalDetik; const elementTimer = document.getElementById('countdown');
            const intervalTimer = setInterval(() => {
                let jam = Math.floor(sisaWaktu / 3600); let menit = Math.floor((sisaWaktu % 3600) / 60); let detik = sisaWaktu % 60;
                elementTimer.innerText = `${jam < 10 ? '0'+jam : jam}:${menit < 10 ? '0'+menit : menit}:${detik < 10 ? '0'+detik : detik}`;
                if (sisaWaktu <= 0) { clearInterval(intervalTimer); finishExam(); } sisaWaktu--;
            }, 1000);
        }

        function finishExam() {
            if(confirm("Apakah Anda yakin ingin menyelesaikan lembar ujian BAB 4 ini?")) {
                localStorage.setItem('jawabanSiswa', JSON.stringify(jawabanSiswa));
                window.location.href = "output.html"; 
            }
        }
    </script>
</body>
</html>
