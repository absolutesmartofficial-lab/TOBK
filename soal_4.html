<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Ujian - TOBK 5 Soal Bergambar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen font-sans antialiased text-slate-800">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 px-6 py-4 flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <span class="bg-blue-600 text-white font-bold px-3 py-1.5 rounded-lg text-sm tracking-wider">TOBK</span>
            <h2 class="font-semibold text-slate-700 border-l border-slate-200 pl-3">Ujian Khusus: Evaluasi Gambar Fisika (5 Soal)</h2>
        </div>
        
        <div class="flex items-center gap-6">
            <div class="text-right hidden sm:block">
                <p class="text-xs text-slate-400">Peserta Ujian</p>
                <p id="displayName" class="text-sm font-semibold text-slate-700">-</p>
            </div>
            <div class="bg-amber-50 border border-amber-200 rounded-xl px-4 py-2 flex items-center gap-2">
                <svg class="w-5 h-5 text-amber-600 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span id="countdown" class="font-mono font-bold text-amber-700 text-sm">02:00:00</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">
                <div class="flex justify-between items-center mb-6">
                    <span id="textNomorSoal" class="bg-blue-50 text-blue-700 px-3 py-1 rounded-md text-xs font-bold uppercase tracking-wider">SOAL NOMOR 1</span>
                    <span class="text-xs text-slate-400">Bobot: 20 Poin</span>
                </div>

                <div id="kontenSoal" class="text-base md:text-lg text-slate-800 leading-relaxed mb-8 font-medium"></div>
                <div id="kontenPilihan" class="space-y-3"></div>
            </div>

            <div class="flex justify-between items-center">
                <button id="btnPrev" onclick="pergiKeSoal(currentIdx - 1)" class="bg-white border border-slate-300 text-slate-600 px-5 py-2.5 rounded-xl text-sm font-medium hover:bg-slate-50 transition disabled:opacity-40 disabled:cursor-not-allowed">
                    Sebelumnya
                </button>
                <button id="btnRagu" onclick="tandaiRaguRagu()" class="bg-amber-500 hover:bg-amber-600 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition">
                    Ragu-Ragu
                </button>
                <button id="btnNext" onclick="pergiKeSoal(currentIdx + 1)" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl text-sm font-medium shadow-md shadow-blue-100 transition">
                    Selanjutnya
                </button>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 h-fit">
            <h3 class="text-sm font-bold text-slate-700 mb-4 border-b border-slate-100 pb-3">Navigasi Soal</h3>
            
            <div id="gridNavigasi" class="grid grid-cols-5 gap-2"></div>

            <div class="mt-6 pt-4 border-t border-slate-100 grid grid-cols-2 gap-2 text-xs text-slate-500">
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-blue-600 inline-block"></span> Aktif</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-emerald-500 inline-block"></span> Terjawab</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-amber-500 inline-block"></span> Ragu-Ragu</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-white border border-slate-200 inline-block"></span> Belum Diisi</div>
            </div>

            <div class="mt-6 border-t border-slate-100 pt-4">
                <button onclick="finishExam()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-xl text-sm transition shadow-lg shadow-emerald-50">
                    Selesai Ujian & Kumpulkan
                </button>
            </div>
        </div>
    </main>

    <script>
        // Data Bank Soal Berisi Gambar Offline dengan Kunci: A, A, B, D, C
        const dataUjian = [
            { 
                id: 1, 
                tanya: "Perhatikan gambar di bawah ini! Besar resultan ketiga vektor gaya tersebut adalah... <br><img src='gambar1.png' class='mx-auto my-4 max-h-48 rounded-xl border shadow-sm' alt='Gambar Soal 1'>", 
                opsi: ["A. 12 N", "B. 16 N", "C. 20 N", "D. 24 N"]
            },
            { 
                id: 2, 
                tanya: "Berdasarkan grafik hasil pengukuran jangka sorong berikut, tebal benda yang diukur adalah... <br><img src='gambar2.png' class='mx-auto my-4 max-h-48 rounded-xl border shadow-sm' alt='Gambar Soal 2'>", 
                opsi: ["A. 2,34 cm", "B. 2,38 cm", "C. 2,40 cm", "D. 2,44 cm"]
            },
            { 
                id: 3, 
                tanya: "Perhatikan grafik hubungan kecepatan (v) terhadap waktu (t) di bawah. Jarak yang ditempuh benda selama 5 sekon pertama adalah... <br><img src='gambar3.png' class='mx-auto my-4 max-h-48 rounded-xl border shadow-sm' alt='Gambar Soal 3'>", 
                opsi: ["A. 30 meter", "B. 40 meter", "C. 50 meter", "D. 60 meter"]
            },
            { 
                id: 4, 
                tanya: "Sebuah balok ditarik oleh gaya F seperti pada gambar. Jika lantai kasar, arah gaya gesek yang bekerja pada balok adalah... <br><img src='gambar4.png' class='mx-auto my-4 max-h-48 rounded-xl border shadow-sm' alt='Gambar Soal 4'>", 
                opsi: ["A. Searah dengan perpindahan benda", "B. Tegak lurus ke atas", "C. Searah dengan gaya F", "D. Berlawanan arah dengan gerak benda"]
            },
            { 
                id: 5, 
                tanya: "Perhatikan lintasan gerak parabola sebuah bola berikut. Titik yang menunjukkan bola mencapai ketinggian maksimum adalah titik... <br><img src='gambar5.png' class='mx-auto my-4 max-h-48 rounded-xl border shadow-sm' alt='Gambar Soal 5'>", 
                opsi: ["A. Titik A", "B. Titik B", "C. Titik C", "D. Titik D"]
            }
        ];

        let currentIdx = 0; 
        let jawabanSiswa = new Array(dataUjian.length).fill(null); 
        let statusRagu = new Array(dataUjian.length).fill(false);   

        document.addEventListener("DOMContentLoaded", function() {
            const namaSiswa = localStorage.getItem('namaSiswa');
            if (!namaSiswa) { window.location.href = "index.html"; return; }
            document.getElementById('displayName').innerText = namaSiswa;
            renderSoal(); renderNavigasiPanel(); initCountdown(7200);
        });

        function renderSoal() {
            const itemSoal = dataUjian[currentIdx];
            document.getElementById('textNomorSoal').innerText = `SOAL NOMOR ${itemSoal.id}`;
            
            // Menggunakan innerHTML agar tag gambar <img> dirender dengan benar oleh browser
            document.getElementById('kontenSoal').innerHTML = itemSoal.tanya;

            const kontenerPilihan = document.getElementById('kontenPilihan');
            kontenerPilihan.innerHTML = ''; 

            itemSoal.opsi.forEach((opsiTeks, idx) => {
                const terpilih = jawabanSiswa[currentIdx] === idx;
                const stylingCard = terpilih ? 'border-blue-500 bg-blue-50/40 text-blue-900 font-semibold ring-1 ring-blue-500' : 'border-slate-200 text-slate-700 hover:bg-slate-50/80';
                kontenerPilihan.insertAdjacentHTML('beforeend', `<label onclick="simpanJawabanSiswa(${idx})" class="flex items-center gap-4 p-4 rounded-xl border ${stylingCard} cursor-pointer transition"><input type="radio" name="opsiUjian" ${terpilih ? 'checked' : ''} class="w-4 h-4 text-blue-600 font-medium"><span class="text-sm">${opsiTeks}</span></label>`);
            });

            document.getElementById('btnPrev').disabled = (currentIdx === 0);
            const btnNext = document.getElementById('btnNext');
            if (currentIdx === dataUjian.length - 1) {
                btnNext.innerText = "Selesai"; btnNext.className = "bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl text-sm font-medium shadow-md transition"; btnNext.onclick = finishExam;
            } else {
                btnNext.innerText = "Selanjutnya"; btnNext.className = "bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl text-sm font-medium shadow-md transition"; btnNext.onclick = () => pergiKeSoal(currentIdx + 1);
            }
        }

        function simpanJawabanSiswa(idxOpsi) { jawabanSiswa[currentIdx] = idxOpsi; statusRagu[currentIdx] = false; renderSoal(); renderNavigasiPanel(); }
        function tandaiRaguRagu() { if (jawabanSiswa[currentIdx] === null) { alert("Pilih opsi jawaban terlebih dahulu!"); return; } statusRagu[currentIdx] = !statusRagu[currentIdx]; renderSoal(); renderNavigasiPanel(); }
        function pergiKeSoal(targetIdx) { if (targetIdx >= 0 && targetIdx < dataUjian.length) { currentIdx = targetIdx; renderSoal(); renderNavigasiPanel(); } }

        function renderNavigasiPanel() {
            const panelGrid = document.getElementById('gridNavigasi'); panelGrid.innerHTML = ''; 
            dataUjian.forEach((soal, idx) => {
                let statusStyle = "bg-white border-slate-200 text-slate-700"; 
                if (jawabanSiswa[idx] !== null) statusStyle = "bg-emerald-500 text-white border-emerald-600"; 
                if (statusRagu[idx]) statusStyle = "bg-amber-500 text-white border-amber-600"; 
                if (idx === currentIdx) statusStyle = "bg-blue-600 text-white ring-4 ring-blue-100 border-blue-700 font-bold"; 
                panelGrid.insertAdjacentHTML('beforeend', `<button onclick="pergiKeSoal(${idx})" class="w-full aspect-square rounded-xl text-xs font-semibold border ${statusStyle}">${soal.id}</button>`);
            });
        }

        function initCountdown(totalDetik) {
            let sisaWaktu = totalDetik; const elementTimer = document.getElementById('countdown');
            const intervalTimer = setInterval(() => {
                let jam = Math.floor(sisaWaktu / 3600); let menit = Math.floor((sisaWaktu % 3600) / 60); let detik = sisaWaktu % 60;
                elementTimer.innerText = `${jam < 10 ? '0'+jam : jam}:${menit < 10 ? '0'+menit : menit}:${detik < 10 ? '0'+detik : detik}`;
                if (sisaWaktu <= 0) { clearInterval(intervalTimer); finishExam(); } sisaWaktu--;
            }, 1000);
        }

        function finishExam() {
            if(confirm("Apakah Anda yakin ingin menyelesaikan lembar ujian ini?")) {
                localStorage.setItem('jawabanSiswa', JSON.stringify(jawabanSiswa));
                window.location.href = "output.html"; 
            }
        }
    </script>
</body>
</html>
